services:
  - type: web
    name: rsutariya-exports
    runtime: static
    buildCommand: npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /about/
        destination: /about/index.html
      - type: rewrite
        source: /collection
        destination: /collection/index.html
      - type: rewrite
        source: /collection/
        destination: /collection/index.html
      - type: rewrite
        source: /certifications
        destination: /certifications/index.html
      - type: rewrite
        source: /certifications/
        destination: /certifications/index.html
      - type: rewrite
        source: /export-shipping
        destination: /export-shipping/index.html
      - type: rewrite
        source: /export-shipping/
        destination: /export-shipping/index.html
      - type: rewrite
        source: /diamond-journey
        destination: /diamond-journey/index.html
      - type: rewrite
        source: /diamond-journey/
        destination: /diamond-journey/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /contact/
        destination: /contact/index.html
      - type: rewrite
        source: /*
        destination: /index.html

